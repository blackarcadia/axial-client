name: Release Beta Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  APP_CHANNEL: release

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build macOS package
        run: ./gradlew clean jpackageMac -PappVersion="${APP_VERSION}" -PappChannel="${APP_CHANNEL}"

      - name: Create macOS app zip
        run: |
          cd build/jpackage
          ditto -c -k --sequesterRsrc --keepParent AxialLauncher.app AxialLauncher.app.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiallauncher-macos
          path: build/jpackage/AxialLauncher.app.zip

  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Windows packages
        run: ./gradlew.bat clean prepareWindowsPortableZipLayout jpackageWindowsInstaller -PappVersion="${env:APP_VERSION}" -PappChannel="${env:APP_CHANNEL}"

      - name: Rename Windows installer
        shell: pwsh
        run: Move-Item -Path "build/jpackage/AxialLauncher-${env:APP_VERSION}.exe" -Destination "build/jpackage/AxialLauncher-windows-installer.exe" -Force

      - name: Create Windows app zip
        shell: pwsh
        run: Compress-Archive -Path build/jpackage/AxialLauncher-windows-portable/* -DestinationPath build/jpackage/AxialLauncher-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiallauncher-windows
          path: |
            build/jpackage/AxialLauncher-windows-installer.exe
            build/jpackage/AxialLauncher-windows.zip

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1beta.${{ github.run_number }}
          name: v1beta.${{ github.run_number }}
          prerelease: false
          files: release-artifacts/*
