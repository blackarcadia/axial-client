buildscript {
    repositories {
        mavenCentral()
    }

    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.8.2'
    }
}

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'fabric-loom' version '1.15-SNAPSHOT'
}

group = 'org.example'
version = '1.0-SNAPSHOT'
def appVersion = (project.findProperty("appVersion") ?: "1.0.0").toString()
def appChannel = (project.findProperty("appChannel") ?: "dev").toString()
def axialUtilsFile = "axialutils-1.0-SNAPSHOT.jar"

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net' }
    flatDir {
        dirs 'src/main/resources'
    }
}

javafx {
    version = '21.0.7'
    modules = [ 'javafx.controls', 'javafx.media', 'javafx.swing' ]
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.apache.commons:commons-compress:1.26.0'
    implementation 'net.raphimc:MinecraftAuth:5.0.0'
    implementation 'me.friwi:jcefmaven:146.0.10'

    def browserOs = org.gradle.internal.os.OperatingSystem.current()
    def browserPlatform = browserOs.isMacOsX() ? 'macosx' : browserOs.isWindows() ? 'windows' : 'linux'
    def browserArch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'arm64' : 'amd64'

    runtimeOnly "me.friwi:jcef-natives-${browserPlatform}-${browserArch}:jcef-d3de827+cef-146.0.10+g8219561+chromium-146.0.7680.179"

    minecraft 'com.mojang:minecraft:1.21.11'
    mappings "net.fabricmc:yarn:1.21.11+build.2:v2"
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    modImplementation name: 'geckolib-fabric-1.21.11-5.4.5'
    include name: 'geckolib-fabric-1.21.11-5.4.5'
    include implementation('net.raphimc:MinecraftAuth:5.0.0')

    // Loom's include is not transitive; MinecraftAuth needs these inside the game too.
    include implementation('net.lenni0451.commons:httpclient:1.9.0')
    include implementation('net.lenni0451.commons:gson:1.9.0')

    modImplementation name: 'axialutils-1.0-SNAPSHOT'
    include name: 'axialutils-1.0-SNAPSHOT'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    exclude('axial-cosmetics-*.jar')
    exclude(axialUtilsFile)
    exclude('staticbgmod-1.0.0.jar')
    exclude('staticbgmod-1.0.1.jar')
    exclude('staticbgmod-1.0.2.jar')
    exclude('staticbgmod-1.0.3.jar')
    exclude('staticbgmod-1.0.4.jar')

    filesMatching('version.properties') {
        expand(appVersion: appVersion, appChannel: appChannel)
    }
}

// IntelliJ's direct Fabric launch configuration reads mods from run/mods.
// Keep bundled mods there so their dependencies resolve before the nested
// production JAR has been built.
tasks.register('installDevelopmentMods', Copy) {
    from('src/main/resources') {
        include 'geckolib-fabric-1.21.11-5.4.5.jar'
        include 'fabric-api-0.141.6+1.21.11.jar'
        include 'fabric-language-kotlin-1.14.1+kotlin.2.4.20.jar'
        include 'yet_another_config_lib_v3-3.8.2+1.21.11-fabric.jar'
        include 'zoomify-2.15.2+1.21.11.jar'
    }
    into layout.projectDirectory.dir('run/mods')
}

tasks.named('classes') {
    finalizedBy tasks.named('installDevelopmentMods')
}

def bundledModsDir = layout.buildDirectory.dir("generated/bundled-mods")
def remapJarTask = tasks.named('remapJar')

tasks.register('bundleCosmeticsJar', Jar) {
    group = 'distribution'
    description = 'Create bundled Axial cosmetics mod without launcher classes'

    dependsOn remapJarTask

    archiveFileName.set('axial-cosmetics.jar')
    destinationDirectory.set(bundledModsDir)

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    zip64 = true

    from({
        zipTree(remapJarTask.get().archiveFile.get().asFile)
    }) {
        // The launcher is packaged separately and obfuscated.
        // Never expose the original launcher classes inside the Fabric mod.
        exclude 'org/example/**'

        // Remove signatures from the source JAR.
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.EC'
        exclude 'META-INF/*.SIG'
    }
}

application {
    mainClass = 'org.example.Main'
}


// ============================================================
// Normal development fat JAR
// ============================================================

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Package all dependencies into a single executable jar'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    zip64 = true
    archiveClassifier.set('all')

    from(sourceSets.main.output)
    from(bundledModsDir)

    dependsOn tasks.bundleCosmeticsJar
    dependsOn(configurations.runtimeClasspath)

    from({
        configurations.runtimeClasspath.files
                .findAll {
                    it.name.endsWith('jar') &&
                            !it.absolutePath.contains('.gradle/caches/fabric-loom')
                }
                .collect { zipTree(it) }
    }) {
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.EC'
        exclude 'META-INF/*.SIG'
    }

    manifest {
        attributes 'Main-Class': application.mainClass
    }
}


// ============================================================
// Launcher-only JAR for ProGuard
// ============================================================

tasks.register('launcherJar', Jar) {
    group = 'distribution'
    description = 'Create launcher-only JAR for release obfuscation'

    dependsOn tasks.classes

    archiveClassifier.set('launcher-input')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        include 'org/example/**'
    }

    manifest {
        attributes 'Main-Class': application.mainClass
    }
}


// ============================================================
// AxialClient release obfuscation
//
// Only org.example launcher code goes through ProGuard.
// Dependencies are library inputs only and are NOT modified.
// ============================================================

tasks.register('obfuscateRelease', proguard.gradle.ProGuardTask) {
    group = 'distribution'
    description = 'Obfuscate AxialClient launcher code for release'

    dependsOn tasks.launcherJar

    def inputJar = tasks.launcherJar.archiveFile
    def outputDir = layout.buildDirectory.dir('obfuscated')
    def outputJar = outputDir.map {
        it.file("${project.name}-${version}-launcher-obfuscated.jar")
    }

    doFirst {
        outputDir.get().asFile.mkdirs()
        layout.buildDirectory.dir('obfuscation').get().asFile.mkdirs()
    }

    injars inputJar
    outjars outputJar

    // Third-party dependencies are reference libraries only.
    // ProGuard cannot rename or modify libraryjars.
    configurations.runtimeClasspath.files.each { dependency ->
        if (dependency.exists()) {
            libraryjars dependency
        }
    }

    // Java 21 runtime libraries.
    def javaHome = System.getProperty('java.home')

    libraryjars(
            "${javaHome}/jmods/java.base.jmod",
            jarfilter: '!**.jar',
            filter: '!module-info.class'
    )

    libraryjars(
            "${javaHome}/jmods/java.desktop.jmod",
            jarfilter: '!**.jar',
            filter: '!module-info.class'
    )

    libraryjars(
            "${javaHome}/jmods/java.logging.jmod",
            jarfilter: '!**.jar',
            filter: '!module-info.class'
    )

    libraryjars(
            "${javaHome}/jmods/java.management.jmod",
            jarfilter: '!**.jar',
            filter: '!module-info.class'
    )

    libraryjars(
            "${javaHome}/jmods/java.naming.jmod",
            jarfilter: '!**.jar',
            filter: '!module-info.class'
    )

    libraryjars(
            "${javaHome}/jmods/java.net.http.jmod",
            jarfilter: '!**.jar',
            filter: '!module-info.class'
    )

    libraryjars(
            "${javaHome}/jmods/java.sql.jmod",
            jarfilter: '!**.jar',
            filter: '!module-info.class'
    )

    configuration 'proguard/axial-release.pro'
}


// ============================================================
// Final protected release fat JAR
//
// Contains:
// - obfuscated org.example launcher
// - untouched resources
// - untouched Fabric/cosmetics code
// - untouched third-party libraries
// - bundled cosmetics JAR
// ============================================================

tasks.register('releaseFatJar', Jar) {
    group = 'distribution'
    description = 'Create final release fat JAR using obfuscated launcher code'

    dependsOn tasks.obfuscateRelease
    dependsOn tasks.bundleCosmeticsJar
    dependsOn(configurations.runtimeClasspath)

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    zip64 = true
    archiveClassifier.set('release-all')

    // Preserve resources and non-launcher classes.
    // Do NOT include the original readable org.example classes.
    from(sourceSets.main.output) {
        exclude 'org/example/**'
    }

    // Add the obfuscated launcher classes instead.
    def obfuscatedLauncherJar = layout.buildDirectory.file(
            "obfuscated/${project.name}-${version}-launcher-obfuscated.jar"
    )

    from({
        zipTree(obfuscatedLauncherJar.get().asFile)
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.EC'
        exclude 'META-INF/*.SIG'
    }

    // Preserve bundled Fabric mod.
    from(bundledModsDir)
    // Bundle GeckoLib as a standalone Fabric mod.
    // The launcher updater will extract this JAR into the mods folder.
    from('src/main/resources') {
        include 'geckolib-fabric-1.21.11-5.4.5.jar'
    }

    // Add all third-party runtime dependencies unchanged.
    from({
        configurations.runtimeClasspath.files
                .findAll {
                    it.name.endsWith('jar') &&
                            !it.absolutePath.contains('.gradle/caches/fabric-loom')
                }
                .collect { zipTree(it) }
    }) {
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.EC'
        exclude 'META-INF/*.SIG'
    }

    manifest {
        attributes 'Main-Class': application.mainClass
    }
}


// ============================================================
// Prepare protected release JAR for jpackage
// ============================================================

def releaseInputDir = layout.buildDirectory.dir('release-input')
def releaseMainJarName = "${project.name}-${version}-all.jar"

tasks.register('prepareObfuscatedRelease', Copy) {
    group = 'distribution'
    description = 'Prepare protected AxialClient release JAR for jpackage'

    dependsOn tasks.releaseFatJar

    from(tasks.releaseFatJar.archiveFile)
    into(releaseInputDir)

    rename {
        releaseMainJarName
    }

    doFirst {
        delete releaseInputDir.get().asFile
        releaseInputDir.get().asFile.mkdirs()
    }
}


// ============================================================
// Platform packaging
// ============================================================

def currentOs = org.gradle.internal.os.OperatingSystem.current()
def isMac = currentOs.isMacOsX()
def isWindows = currentOs.isWindows()
def mainJarName = "${project.name}-${version}-all.jar"

tasks.register('runtimeImage', Exec) {
    group = 'distribution'
    description = 'Create trimmed runtime image (requires JDK with jlink)'

    dependsOn tasks.prepareObfuscatedRelease

    doFirst {
        delete "${buildDir}/runtime"
    }

    commandLine 'jlink',
            '--add-modules',
            'java.base,java.net.http,java.desktop,java.logging,java.management,java.naming,java.sql,java.compiler,jdk.crypto.ec,jdk.naming.dns,jdk.unsupported,jdk.unsupported.desktop,jdk.zipfs,jdk.jsobject,jdk.xml.dom',
            '--strip-debug',
            '--no-header-files',
            '--no-man-pages',
            '--output',
            "${buildDir}/runtime"
}

tasks.register('jpackageMac') {
    group = 'distribution'
    description = 'Package macOS app image (requires macOS + jpackage)'

    dependsOn tasks.runtimeImage
    onlyIf { isMac }

    doLast {
        def libsDir = releaseInputDir.get().asFile
        def runtimeDir = layout.buildDirectory.dir("runtime").get().asFile
        def packageDir = layout.buildDirectory.dir("jpackage").get().asFile
        def appImageDir = new File(packageDir, "AxialLauncher.app")
        def dmgStageDir = new File('/tmp/axiallauncher-dmg-stage')
        def outImage = new File(packageDir, "AxialLauncher-${appVersion}.dmg")

        delete outImage
        delete appImageDir
        delete dmgStageDir

        packageDir.mkdirs()

        def runCommand = { List<String> command ->
            def stringCommand = command.collect { it.toString() }

            def process = new ProcessBuilder(stringCommand)
                    .directory(projectDir)
                    .inheritIO()
                    .start()

            def exitCode = process.waitFor()

            if (exitCode != 0) {
                throw new GradleException(
                        "Command failed (${exitCode}): ${stringCommand.join(' ')}"
                )
            }
        }

        def appImageCommand = [
                'jpackage',
                '--type', 'app-image',
                '--name', 'AxialLauncher',
                '--app-version', appVersion,
                '--mac-package-identifier', 'com.axial.launcher',
                '--input', libsDir.absolutePath,
                '--main-jar', mainJarName,
                '--main-class', application.mainClass.get(),
                '--runtime-image', runtimeDir.absolutePath,
                '--dest', packageDir.absolutePath
        ]

        def iconPath =
                layout.projectDirectory.file("src/main/resources/icon.icns").asFile

        if (iconPath.exists()) {
            appImageCommand += ['--icon', iconPath.absolutePath]
        }

        runCommand(appImageCommand)

        if (!appImageDir.exists()) {
            throw new GradleException(
                    "Expected app image was not created: ${appImageDir.absolutePath}"
            )
        }
    }
}

tasks.register('jpackageWindows') {
    group = 'distribution'
    description = 'Package Windows app image (requires Windows + jpackage)'

    dependsOn tasks.runtimeImage
    onlyIf { isWindows }

    doLast {
        def libsDir = releaseInputDir.get().asFile
        def runtimeDir = layout.buildDirectory.dir("runtime").get().asFile
        def packageDir = layout.buildDirectory.dir("jpackage").get().asFile
        def appImageDir = new File(packageDir, "AxialLauncher")

        delete appImageDir

        packageDir.mkdirs()

        def command = [
                'jpackage',
                '--type', 'app-image',
                '--name', 'AxialLauncher',
                '--app-version', appVersion,
                '--vendor', 'Axial',
                '--input', libsDir.absolutePath,
                '--main-jar', mainJarName,
                '--main-class', application.mainClass.get(),
                '--runtime-image', runtimeDir.absolutePath,
                '--dest', packageDir.absolutePath
        ]

        def iconPath =
                layout.projectDirectory.file("src/main/resources/app-icon.ico").asFile

        if (iconPath.exists()) {
            command += ['--icon', iconPath.absolutePath]
        }

        def process = new ProcessBuilder(command.collect { it.toString() })
                .directory(projectDir)
                .inheritIO()
                .start()

        def exitCode = process.waitFor()

        if (exitCode != 0) {
            throw new GradleException(
                    "Command failed (${exitCode}): ${command.join(' ')}"
            )
        }

        if (!appImageDir.exists()) {
            throw new GradleException(
                    "Expected app image was not created: ${appImageDir.absolutePath}"
            )
        }
    }
}

tasks.register('prepareWindowsPortableZipLayout', Sync) {
    group = 'distribution'
    description = 'Create the Windows portable zip layout with launch and shortcut helpers'

    dependsOn tasks.jpackageWindows
    onlyIf { isWindows }

    def packageDirProvider = layout.buildDirectory.dir("jpackage")
    def appImageDirProvider =
            packageDirProvider.map { it.dir("AxialLauncher") }
    def portableDirProvider =
            packageDirProvider.map { it.dir("AxialLauncher-windows-portable") }

    from(appImageDirProvider) {
        into('AxialLauncher')
    }

    into(portableDirProvider)

    doFirst {
        delete portableDirProvider.get().asFile
    }

    doLast {
        def portableDir = portableDirProvider.get().asFile

        new File(
                portableDir,
                "Launch AxialLauncher.bat"
        ).text = '''@echo off
set "APP_DIR=%~dp0AxialLauncher"
pushd "%APP_DIR%"
start "" "AxialLauncher.exe"
popd
'''

        new File(
                portableDir,
                "Create Desktop Shortcut.cmd"
        ).text = '''@echo off
powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Create Desktop Shortcut.ps1"
pause
'''

        new File(
                portableDir,
                "Create Desktop Shortcut.ps1"
        ).text = '''$ErrorActionPreference = "Stop"
$appDir = Join-Path $PSScriptRoot "AxialLauncher"
$exe = Join-Path $appDir "AxialLauncher.exe"

if (-not (Test-Path $exe)) {
    throw "AxialLauncher.exe was not found. Extract the full zip first, then run this shortcut helper from the extracted folder."
}

$desktop = [Environment]::GetFolderPath("Desktop")
$shortcutPath = Join-Path $desktop "AxialLauncher.lnk"
$shell = New-Object -ComObject WScript.Shell
$shortcut = $shell.CreateShortcut($shortcutPath)
$shortcut.TargetPath = $exe
$shortcut.WorkingDirectory = $appDir
$shortcut.IconLocation = $exe
$shortcut.Save()

Write-Host "Created desktop shortcut: $shortcutPath"
Write-Host "Keep the extracted AxialLauncher folder in this location. Do not move AxialLauncher.exe out of it."
'''

        new File(
                portableDir,
                "README-WINDOWS.txt"
        ).text = '''AxialLauncher for Windows

Recommended install:
Run AxialLauncher-windows-installer.exe. It creates working Desktop and Start Menu shortcuts automatically.

Portable zip:
Extract the full zip before launching.
Use "Launch AxialLauncher.bat" or run "Create Desktop Shortcut.cmd".
Do not drag or move AxialLauncher.exe by itself to the Desktop. The executable must stay inside the AxialLauncher folder because it needs files in AxialLauncher\\app.
'''
    }
}

tasks.register('jpackageWindowsInstaller') {
    group = 'distribution'
    description = 'Package Windows installer with Desktop and Start Menu shortcuts (requires Windows + jpackage + WiX)'

    dependsOn tasks.runtimeImage
    onlyIf { isWindows }

    doLast {
        def libsDir = releaseInputDir.get().asFile
        def runtimeDir = layout.buildDirectory.dir("runtime").get().asFile
        def packageDir = layout.buildDirectory.dir("jpackage").get().asFile
        def installerFile =
                new File(packageDir, "AxialLauncher-${appVersion}.exe")

        delete installerFile

        packageDir.mkdirs()

        def command = [
                'jpackage',
                '--type', 'exe',
                '--name', 'AxialLauncher',
                '--app-version', appVersion,
                '--vendor', 'Axial',
                '--input', libsDir.absolutePath,
                '--main-jar', mainJarName,
                '--main-class', application.mainClass.get(),
                '--runtime-image', runtimeDir.absolutePath,
                '--dest', packageDir.absolutePath,
                '--win-shortcut',
                '--win-menu',
                '--win-menu-group', 'Axial'
        ]

        def iconPath =
                layout.projectDirectory.file("src/main/resources/app-icon.ico").asFile

        if (iconPath.exists()) {
            command += ['--icon', iconPath.absolutePath]
        }

        def process = new ProcessBuilder(command.collect { it.toString() })
                .directory(projectDir)
                .inheritIO()
                .start()

        def exitCode = process.waitFor()

        if (exitCode != 0) {
            throw new GradleException(
                    "Command failed (${exitCode}): ${command.join(' ')}"
            )
        }

        if (!installerFile.exists()) {
            throw new GradleException(
                    "Expected installer was not created: ${installerFile.absolutePath}"
            )
        }
    }
}

tasks.register('macUninstaller') {
    group = 'distribution'
    description = 'Generate a macOS uninstaller script'

    onlyIf { isMac }

    doLast {
        def outDir = file("${buildDir}/jpackage")
        outDir.mkdirs()

        def script =
                new File(outDir, "uninstall-axiallauncher.command")

        script.text = '''#!/bin/bash
set -e
APP_PATH="/Applications/AxialLauncher.app"
LOG_PATH="$HOME/Library/Logs/AxialLauncher"

echo "Removing $APP_PATH"
rm -rf "$APP_PATH" || true

echo "Removing logs at $LOG_PATH"
rm -rf "$LOG_PATH" || true

echo "Done."
'''

        script.setExecutable(true)
    }
}

test {
    useJUnitPlatform()
    dependsOn tasks.remapJar
    systemProperty(
            'axial.test.modJar',
            tasks.remapJar.archiveFile.get().asFile.absolutePath
    )
}
