# This deployment only prepares and serves prisons. Older world lists are migrated on load.
worlds: [prisons]
auto-render: true
# Prepare every eligible loaded world on startup, retaining any completed cache while rebuilding.
refresh-on-startup: true
# Protects worlds still using Minecraft's enormous default border.
# Set a real world border before building a map. Increase this limit deliberately.
max-border-diameter: 16384
# Overview edge length; the client supports up to 512 pixels per edge.
resolution: 512
# Allows unseen terrain to appear even when it has never been generated.
# Rendering samples the overview, rather than pre-generating every chunk in the border.
generate-missing-chunks: true
# Chunk loading is asynchronous, with bounded concurrency and a TPS backoff.
chunks-per-tick: 1
max-in-flight: 2
# Retry a stuck asynchronous load, up to three attempts, then save progress and report failure.
chunk-load-timeout-seconds: 60
pause-below-tps: 18.5
# Already-loaded chunks can be read directly, sharing a time budget with completions.
# These settings also apply when upgrading an existing configuration without these keys.
loaded-chunks-per-tick: 64
render-time-budget-ms: 2.0
# Background maintenance checks every minute; joins and world changes only transfer cached maps.
# Completed snapshots stay available while replacements build and save.
refresh-minutes: 60
# Total outgoing map packets across all players, each below 30 KB.
messages-per-tick: 2
# Faster initial transfer on joins/world changes; background snapshot updates use the above limit.
initial-transfer-packets-per-tick: 12
